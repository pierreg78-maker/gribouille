<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Atelier de Tampons Poétiques</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 10px;
        }
        header {
            text-align: center;
        }
        h1 {
            margin: 0 0 2px 0;
            font-size: 1.2rem;
            color: #e94560;
        }
        p {
            color: #b2bec3;
            font-size: 0.8rem;
            margin: 0;
        }
        canvas {
            background: #16213e;
            border: 2px dashed #0f3460;
            border-radius: 16px;
            cursor: crosshair;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            touch-action: none;
            width: 100%;
            max-width: 450px;
            height: 50vh;
        }
        /* Palette de tampons horizontale et scrollable */
        #palette {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            max-width: 100%;
            padding: 10px 0;
            scrollbar-width: none; /* Firefox */
        }
        #palette::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
        .stamp-btn {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            font-size: 1.5rem;
            padding: 10px;
            min-width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .stamp-btn.active {
            border-color: #e94560;
            background: #253359;
            transform: scale(1.05);
        }
        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        button.action-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Atelier Poétique</h1>
        <p>Choisis ton tampon et pose-le sur la toile !</p>
    </header>

    <canvas id="canvas"></canvas>

    <!-- La palette des 12 tampons -->
    <div id="palette">
        <div class="stamp-btn active" data-stamp="🌸">🌸</div>
        <div class="stamp-btn" data-stamp="🌳">🌳</div>
        <div class="stamp-btn" data-stamp="☀️">☀️</div>
        <div class="stamp-btn" data-stamp="☁️">☁️</div>
        <div class="stamp-btn" data-stamp="🐦">🐦</div>
        <div class="stamp-btn" data-stamp="🦋">🦋</div>
        <div class="stamp-btn" data-stamp="🐱">🐱</div>
        <div class="stamp-btn" data-stamp="🏡">🏡</div>
        <div class="stamp-btn" data-stamp="❤️">❤️</div>
        <div class="stamp-btn" data-stamp="⭐">⭐</div>
        <div class="stamp-btn" data-stamp="🎈">🎈</div>
        <div class="stamp-btn" data-stamp="🌈">🌈</div>
    </div>

    <div id="controls">
        <button class="action-btn" id="clearBtn">Tout effacer</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const stampButtons = document.querySelectorAll('.stamp-btn');

        let currentStamp = '🌸';

        // Gestion de la sélection du tampon
        stampButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                stampButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStamp = btn.getAttribute('data-stamp');
            });
        });

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        function getClientPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Poser un tampon au touché / clic
        function handleCanvasInteraction(e) {
            e.preventDefault();
            const pos = getClientPos(e);
            
            ctx.save();
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Petit effet d'apparition chaleureux (légère rotation aléatoire pour le charme)
            let angle = (Math.random() - 0.5) * 0.4;
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);
            
            ctx.fillText(currentStamp, 0, 0);
            ctx.restore();
        }

        canvas.addEventListener('click', handleCanvasInteraction);
        canvas.addEventListener('touchstart', handleCanvasInteraction, { passive: false });

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
