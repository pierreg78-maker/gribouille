<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métamorphose de Gribouilles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.5rem;
            color: #e94560;
        }
        p {
            color: #b2bec3;
            margin-bottom: 20px;
        }
        canvas {
            background: #16213e;
            border: 2px dashed #0f3460;
            border-radius: 12px;
            cursor: crosshair;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #controls {
            margin-top: 15px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #d63851;
        }
    </style>
</head>
<body>

    <h1>Métamorphose de Gribouilles</h1>
    <p>Dessine un trait libre, puis lève le crayon pour voir la magie opérer !</p>

    <canvas id="canvas" width="600" height="400"></canvas>

    <div id="controls">
        <button id="clearBtn">Effacer le canvas</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');

        let isDrawing = false;
        let points = [];

        // Style du trait utilisateur
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            points = [];
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.moveTo(x, y);
            points.push({x, y});
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            points.push({x, y});
        });

        canvas.addEventListener('mouseup', () => {
            if (!isDrawing) return;
            isDrawing = false;
            EtTransformer();
        });

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function analyserEtTransformer() {
            if (points.length < 5) return;

            // Calculer la boîte englobante (bounding box)
            let minX = Math.min(...points.map(p => p.x));
            let maxX = Math.max(...points.map(p => p.x));
            let minY = Math.min(...points.map(p => p.y));
            let maxY = Math.max(...points.map(p => p.y));
            
            let width = maxX - minX;
            let height = maxY - minY;
            let centerX = minX + width / 2;
            let centerY = minY + height / 2;

            // Vérifier si le trait est fermé (départ proche de la fin)
            let start = points[0];
            let end = points[points.length - 1];
            let distanceDebutFin = Math.hypot(start.x - end.x, start.y - end.y);
            let estFerme = distanceDebutFin < 50;

            ctx.save();
            
            // --- NOUVELLE LOGIQUE ICI ---
            if (estFerme) {
                // 1. Transformation en Planète (inchangé)
                let rayon = Math.max(width, height) / 2;
                ctx.fillStyle = `hsl(${Math.random() * 360}, 70%, 60%)`;
                ctx.beginPath();
                ctx.arc(centerX, centerY, rayon * 0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(centerX - rayon*0.2, centerY - rayon*0.2, rayon * 0.2, 0, Math.PI * 2);
                ctx.fill();

            } else if (width > height * 1.5) {
                // 2. NOUVEAU : Si le tracé est large et ouvert -> Poisson !
                let fishColor = `hsl(${Math.random() * 360}, 80%, 70%)`;
                ctx.fillStyle = fishColor;
                
                // Corps du poisson (basé sur la forme du gribouillis)
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, width/2, height/2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Queue (triangle)
                ctx.beginPath();
                ctx.moveTo(minX - width*0.2, centerY);
                ctx.lineTo(minX, centerY - height*0.4);
                ctx.lineTo(minX, centerY + height*0.4);
                ctx.fill();

                // Œil
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(maxX - width*0.2, centerY - height*0.1, width*0.08, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(maxX - width*0.2, centerY - height*0.1, width*0.03, 0, Math.PI * 2);
                ctx.fill();

            } else {
                // 3. Transformation en Fleur (inchangé)
                ctx.fillStyle = '#ff7675';
                let nbPetales = 6;
                let rayonFleur = Math.max(width, height) * 0.4;
                
                for (let i = 0; i < nbPetales; i++) {
                    let angle = (i * 2 * Math.PI) / nbPetales;
                    let px = centerX + Math.cos(angle) * rayonFleur;
                    let py = centerY + Math.sin(angle) * rayonFleur;
                    ctx.beginPath();
                    ctx.arc(px, py, rayonFleur * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#fdcb6e';
                ctx.beginPath();
                ctx.arc(centerX, centerY, rayonFleur * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    </script>
</body>
</html>
