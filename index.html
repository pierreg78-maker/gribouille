<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Atelier de Tampons Poétiques</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 10px;
        }
        header {
            text-align: center;
        }
        h1 {
            margin: 0 0 2px 0;
            font-size: 1.2rem;
            color: #e94560;
        }
        p {
            color: #b2bec3;
            font-size: 0.8rem;
            margin: 0;
        }
        canvas {
            background: #16213e;
            border: 2px dashed #0f3460;
            border-radius: 16px;
            cursor: crosshair;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            touch-action: none;
            width: 100%;
            max-width: 450px;
            height: 50vh;
        }
        #palette {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            max-width: 100%;
            padding: 10px 0;
            scrollbar-width: none;
        }
        #palette::-webkit-scrollbar {
            display: none;
        }
        .stamp-btn {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            font-size: 1.5rem;
            padding: 10px;
            min-width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .stamp-btn.active {
            border-color: #e94560;
            background: #253359;
            transform: scale(1.05);
        }
        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        button.action-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Atelier Poétique</h1>
        <p>Glisse sur l'écran pour ajuster la taille du tampon !</p>
    </header>

    <canvas id="canvas"></canvas>

    <div id="palette">
        <div class="stamp-btn active" data-stamp="🌸">🌸</div>
        <div class="stamp-btn" data-stamp="🌳">🌳</div>
        <div class="stamp-btn" data-stamp="☀️">☀️</div>
        <div class="stamp-btn" data-stamp="☁️">☁️</div>
        <div class="stamp-btn" data-stamp="🐦">🐦</div>
        <div class="stamp-btn" data-stamp="🦋">🦋</div>
        <div class="stamp-btn" data-stamp="🐱">🐱</div>
        <div class="stamp-btn" data-stamp="🏡">🏡</div>
        <div class="stamp-btn" data-stamp="❤️">❤️</div>
        <div class="stamp-btn" data-stamp="⭐">⭐</div>
        <div class="stamp-btn" data-stamp="🎈">🎈</div>
        <div class="stamp-btn" data-stamp="🌈">🌈</div>
    </div>

    <div id="controls">
        <button class="action-btn" id="clearBtn">Tout effacer</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const stampButtons = document.querySelectorAll('.stamp-btn');

        let currentStamp = '🌸';
        let isInteracting = false;
        let startPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let currentSize = 40; // Taille de base
        let randomAngle = 0;

        stampButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                stampButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStamp = btn.getAttribute('data-stamp');
            });
        });

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        function getClientPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startInteraction(e) {
            e.preventDefault();
            isInteracting = true;
            startPos = getClientPos(e);
            currentPos = { ...startPos };
            currentSize = 40; // Taille initiale
            randomAngle = (Math.random() - 0.5) * 0.4;
        }

        function moveInteraction(e) {
            if (!isInteracting) return;
            e.preventDefault();
            currentPos = getClientPos(e);

            // Calculer la distance par rapport au point de départ pour ajuster la taille
            let distance = Math.hypot(currentPos.x - startPos.x, currentPos.y - startPos.y);
            // Plus on s'éloigne (vers le haut/droite ou autre), plus ça grandit (entre 20px et 150px)
            currentSize = Math.min(Math.max(40 + distance * 0.5, 20), 150);

            redrawCanvas();
            // Dessiner un aperçu en direct du tampon à l'emplacement initial avec sa taille dynamique
            drawStamp(startPos.x, startPos.y, currentSize, randomAngle, 0.7);
        }

        function endInteraction(e) {
            if (!isInteracting) return;
            e.preventDefault();
            isInteracting = false;

            redrawCanvas();
            // Poser définitivement le tampon au point de départ avec la taille choisie
            drawStamp(startPos.x, startPos.y, currentSize, randomAngle, 1.0);
        }

        function drawStamp(x, y, size, angle, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `${size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillText(currentStamp, 0, 0);
            ctx.restore();
        }

        // Pour garder l'historique des tampons posés, on dessine sur le canvas au fur et à mesure
        // Astuce : on garde un tableau des tampons validés si on veut tout redessiner proprement, 
        // ou on fait plus simple : on valide directement sur le canvas au "mouseup/touchend".
        
        let stampsHistory = [];

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Redessiner l'historique
            stampsHistory.forEach(s => {
                drawStamp(s.x, s.y, s.size, s.angle, 1.0);
            });
        }

        // On adapte la fin de l'interaction pour enregistrer dans l'historique
        function endInteractionWithHistory(e) {
            if (!isInteracting) return;
            e.preventDefault();
            isInteracting = false;

            // Ajouter à l'historique
            stampsHistory.push({
                x: startPos.x,
                y: startPos.y,
                size: currentSize,
                angle: randomAngle,
                stamp: currentStamp
            });

            // Redessiner tout
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stampsHistory.forEach(s => {
                // Sauvegarde temporaire du tampon actif pour l'historique
                let temp = currentStamp;
                currentStamp = s.stamp;
                drawStamp(s.x, s.y, s.size, s.angle, 1.0);
                currentStamp = temp;
            });
        }

        // Remplacement de la fin d'interaction
        canvas.addEventListener('mousedown', startInteraction);
        canvas.addEventListener('mousemove', moveInteraction);
        canvas.addEventListener('mouseup', (e) => {
            if (!isInteracting) return;
            // Version simplifiée pour le clic souris classique : pose directe ou glissé
            let dist = Math.hypot(currentPos.x - startPos.x, currentPos.y - startPos.y);
            if (dist < 5) currentSize = 40; // clic simple
            endInteractionWithHistory(e);
        });

        canvas.addEventListener('touchstart', startInteraction, { passive: false });
        canvas.addEventListener('touchmove', moveInteraction, { passive: false });
        canvas.addEventListener('touchend', endInteractionWithHistory, { passive: false });

        clearBtn.addEventListener('click', () => {
            stampsHistory = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
